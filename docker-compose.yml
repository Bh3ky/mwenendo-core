x-app: &app
  build: .
  image: mwenendo-core:local
  restart: unless-stopped
  # Secrets come from your .env. These override what must differ in a container.
  env_file: .env
  environment: &app-env
    DEBUG: "False"
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  profiles: ["app"]

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    <<: *app
    environment:
      <<: *app-env
      # Only the web server counts requests, so only it needs this. The directory
      # is emptied each time gunicorn starts (see gunicorn.conf.py).
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

volumes:
  postgres_data: