[project]
name = "mwenendo-core"
version = "0.1.0"
description = "A high-concurrency, event-driven inventory allocation engine built with Django and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7.0",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-ninja>=1.8.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "locust>=2.47.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
